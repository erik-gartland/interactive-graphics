  #tooltip { position: fixed; background: #fff; border: 1px solid #ccc; border-left: 4px solid #1a3d6e; padding: 10px 14px; font-size: 0.92rem; font-family: var(--font); pointer-events: none; opacity: 0; transition: opacity 0.12s; z-index: 200; min-width: 230px; box-shadow: 0 2px 8px rgba(0,0,0,0.13); line-height: 1.65; }

  .tt-val { font-weight: 600; }
  .tt-row.hl .tt-key { color: #1a3d6e; font-weight: 600; }

  .footer-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; gap: 16px; }
  .source-note { font-size: 0.87rem; color: #777; line-height: 1.5; border-top: 1px solid #e8e8e8; padding-top: 10px; font-family: var(--font); flex: 1; }

const TOT_BREAKS = [1000,5000,15000,50000,100000];
const TOT_COLORS = ['#c6dbef','#6baed6','#2171b5','#08519c','#08306b','#041d45'];
const PCT_BREAKS = [-40,-20,-10,0,10,20,40];
const PCT_COLORS = ['#2166ac','#74add1','#abd9e9','#f7f7f7','#fdae61','#d73027','#a50026'];
const SKIP_LABEL = new Set(['DC','CT','DE','RI','NJ','MD','NH','VT','MA']);
const FONT = "'Nunito Sans',Arial,sans-serif";

// Centroid offsets for labels that overlap borders at default position
const LABEL_OFFSETS = {
  'MI': [14, 16],
  'FL': [16, 10],
  'LA': [-10, -8],
};

// Absolute label positions (override centroid entirely)
const LABEL_ABSOLUTE = {
  'HI': [260, 570],
};

let activeView = 'totals', activeTab = 'overall';

function getTotalColor(fips, tab) {
  const r = DATA[fips]; if (!r) return '#ddd';
  const v = r.y2024[tab];
  for (let i=0; i<TOT_BREAKS.length; i++) { if (v < TOT_BREAKS[i]) return TOT_COLORS[i]; }
  return TOT_COLORS[TOT_COLORS.length-1];
}
function pct(fips, tab) {
  const r = DATA[fips]; if (!r) return null;
  const v23=r.y2023[tab], v24=r.y2024[tab];
  return v23 ? ((v24-v23)/v23)*100 : null;
}
function interpolateHex(c1,c2,t) {
  const p=h=>parseInt(h,16);
  const r1=p(c1.slice(1,3)),g1=p(c1.slice(3,5)),b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)),g2=p(c2.slice(3,5)),b2=p(c2.slice(5,7));
  return `rgb(${Math.round(r1+t*(r2-r1))},${Math.round(g1+t*(g2-g1))},${Math.round(b1+t*(b2-b1))})`;
}
function getPctColor(fips, tab) {
  const v=pct(fips,tab); if (v===null) return '#ccc';
  const cl=Math.max(PCT_BREAKS[0],Math.min(PCT_BREAKS[PCT_BREAKS.length-1],v));
  for (let i=0; i<PCT_BREAKS.length-1; i++) {
    if (cl<=PCT_BREAKS[i+1]) { const t=(cl-PCT_BREAKS[i])/(PCT_BREAKS[i+1]-PCT_BREAKS[i]); return interpolateHex(PCT_COLORS[i],PCT_COLORS[i+1],t); }
  }
  return PCT_COLORS[PCT_COLORS.length-1];
}
function getFillColor(fips) { return activeView==='totals' ? getTotalColor(fips,activeTab) : getPctColor(fips,activeTab); }
function totalLabelColor(fill) { return (['#c6dbef','#6baed6'].includes(fill)) ? '#1a3050' : '#fff'; }
function pctLabelColor(v) { if (v===null) return '#555'; return (v<=-20||v>=20)?'#fff':'#333'; }
function getLabelColor(fips) {
  const r = DATA[fips];
  if (r && LABEL_ABSOLUTE[r.abbr]) return '#333';
  if (activeView==='totals') return totalLabelColor(getTotalColor(fips,activeTab));
  return pctLabelColor(pct(fips,activeTab));
}
function fmt(n) { return n!=null ? n.toLocaleString() : '—'; }
function fmtP(v) { if (v===null) return '—'; return (v>=0?'+':'')+v.toFixed(1)+'%'; }

function renderLegend() {

  wrap.innerHTML = '';
  const BAR_H=14, TICK_Y=BAR_H+14, SVG_H=TICK_Y+4;
  const FS = FONT;

  if (activeView==='totals') {

    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',SVG_W); svg.setAttribute('height',SVG_H); svg.style.display='block';

    grad.setAttribute('id','tot-grad'); grad.setAttribute('x1','0%'); grad.setAttribute('x2','100%'); grad.setAttribute('y1','0%'); grad.setAttribute('y2','0%');
    TOT_COLORS.forEach((c,i)=>{ const s=document.createElementNS('http://www.w3.org/2000/svg','stop'); s.setAttribute('offset',(i/(TOT_COLORS.length-1)*100)+'%'); s.setAttribute('stop-color',c); grad.appendChild(s); });
    defs.appendChild(grad); svg.appendChild(defs);
    const mkTxt=(x,y,anchor,txt)=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor',anchor); t.setAttribute('fill','#555'); t.setAttribute('font-size','13'); t.setAttribute('font-family',FS); t.textContent=txt; svg.appendChild(t); };
    mkTxt(BAR_X-6,BAR_H/2+5,'end','Fewer');
    const bar=document.createElementNS('http://www.w3.org/2000/svg','rect'); bar.setAttribute('x',BAR_X); bar.setAttribute('y',0); bar.setAttribute('width',BAR_W); bar.setAttribute('height',BAR_H); bar.setAttribute('fill','url(#tot-grad)'); svg.appendChild(bar);
    mkTxt(BAR_X+BAR_W+6,BAR_H/2+5,'start','More');
    labels.forEach((lbl,i)=>{ const x=BAR_X+(i/(labels.length-1))*BAR_W; const anchor=i===0?'start':i===labels.length-1?'end':'middle'; const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',x); line.setAttribute('x2',x); line.setAttribute('y1',BAR_H); line.setAttribute('y2',BAR_H+4); line.setAttribute('stroke','#999'); line.setAttribute('stroke-width','1'); svg.appendChild(line); const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',TICK_Y); t.setAttribute('text-anchor',anchor); t.setAttribute('fill','#666'); t.setAttribute('font-size','12'); t.setAttribute('font-family',FS); t.textContent=lbl; svg.appendChild(t); });

  } else {
    document.getElementById('legend-title').textContent=activeTab==='overall'?'Percent change in people experiencing homelessness from 2023 to 2024':activeTab==='sheltered'?'Percent change in people experiencing sheltered homelessness from 2023 to 2024':'Percent change in people experiencing unsheltered homelessness from 2023 to 2024';
    const labels=['≤−40%','−20%','−10%','0%','+10%','+20%','≥+40%'];

    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',SVG_W); svg.setAttribute('height',SVG_H); svg.style.display='block';
    const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
    const grad=document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
    grad.setAttribute('id','pct-grad'); grad.setAttribute('x1','0%'); grad.setAttribute('x2','100%'); grad.setAttribute('y1','0%'); grad.setAttribute('y2','0%');
    PCT_COLORS.forEach((c,i)=>{ const s=document.createElementNS('http://www.w3.org/2000/svg','stop'); s.setAttribute('offset',(i/(PCT_COLORS.length-1)*100)+'%'); s.setAttribute('stop-color',c); grad.appendChild(s); });
    defs.appendChild(grad); svg.appendChild(defs);
    const mkTxt=(x,y,anchor,txt)=>{ const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y); t.setAttribute('text-anchor',anchor); t.setAttribute('fill','#555'); t.setAttribute('font-size','13'); t.setAttribute('font-family',FS); t.textContent=txt; svg.appendChild(t); };
    mkTxt(BAR_X-6,BAR_H/2+5,'end','Decrease');
    const bar=document.createElementNS('http://www.w3.org/2000/svg','rect'); bar.setAttribute('x',BAR_X); bar.setAttribute('y',0); bar.setAttribute('width',BAR_W); bar.setAttribute('height',BAR_H); bar.setAttribute('fill','url(#pct-grad)'); svg.appendChild(bar);
    mkTxt(BAR_X+BAR_W+6,BAR_H/2+5,'start','Increase');
    labels.forEach((lbl,i)=>{ const x=BAR_X+(i/(labels.length-1))*BAR_W; const anchor=i===0?'start':i===labels.length-1?'end':'middle'; const line=document.createElementNS('http://www.w3.org/2000/svg','line'); line.setAttribute('x1',x); line.setAttribute('x2',x); line.setAttribute('y1',BAR_H); line.setAttribute('y2',BAR_H+4); line.setAttribute('stroke','#999'); line.setAttribute('stroke-width','1'); svg.appendChild(line); const t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',TICK_Y); t.setAttribute('text-anchor',anchor); t.setAttribute('fill','#666'); t.setAttribute('font-size','12'); t.setAttribute('font-family',FS); t.textContent=lbl; svg.appendChild(t); });
    wrap.appendChild(svg);
  }
}

const TITLES = {
  totals:{overall:'Total People Experiencing Homelessness by State',sheltered:'Total People Experiencing Sheltered Homelessness by State',unsheltered:'Total People Experiencing Unsheltered Homelessness by State'},
  pct:{overall:'Percent Change in People Experiencing Homelessness by State',sheltered:'Percent Change in People Experiencing Sheltered Homelessness by State',unsheltered:'Percent Change in People Experiencing Unsheltered Homelessness by State'}
};
function updateTitles() {
  document.getElementById('chart-title').textContent=TITLES[activeView][activeTab];
}

function buildTooltip(fips) {
  const rec=DATA[fips]; if (!rec) return '';
  const tabs=['overall','sheltered','unsheltered'], labs=['Overall','Sheltered','Unsheltered'];
  if (activeView==='totals') {
    return `<div class="tt-name">${rec.name}</div>`+tabs.map((t,i)=>`<div class="tt-row${t===activeTab?' hl':''}"><span class="tt-key">${labs[i]}</span><span class="tt-val">${fmt(rec.y2024[t])}</span></div>`).join('');
  } else {
    return `<div class="tt-name">${rec.name}</div>`+tabs.map((t,i)=>{const p=pct(fips,t);return `<div class="tt-row${t===activeTab?' hl':''}"><span class="tt-key">${labs[i]}</span><span class="tt-val">${fmtP(p)}</span></div><div class="tt-sub">${fmt(rec.y2023[t])} → ${fmt(rec.y2024[t])}</div>`;}).join('');
  }
}

// ── Excel Export ──
function exportToExcel() {
  const wb = XLSX.utils.book_new();

  // Sheet 1: Full data
  const rows = [
    ["State","Abbr","2023 Overall","2023 Sheltered","2023 Unsheltered","2024 Overall","2024 Sheltered","2024 Unsheltered","Chg Overall (%)","Chg Sheltered (%)","Chg Unsheltered (%)"]
  ];
  Object.values(DATA).sort((a,b)=>a.name.localeCompare(b.name)).forEach(r=>{
    const chgO = r.y2023.overall ? ((r.y2024.overall-r.y2023.overall)/r.y2023.overall*100) : null;
    const chgS = r.y2023.sheltered ? ((r.y2024.sheltered-r.y2023.sheltered)/r.y2023.sheltered*100) : null;
    const chgU = r.y2023.unsheltered ? ((r.y2024.unsheltered-r.y2023.unsheltered)/r.y2023.unsheltered*100) : null;
    rows.push([
      r.name, r.abbr,
      r.y2023.overall, r.y2023.sheltered, r.y2023.unsheltered,
      r.y2024.overall, r.y2024.sheltered, r.y2024.unsheltered,
      chgO!=null ? +chgO.toFixed(2) : '',
      chgS!=null ? +chgS.toFixed(2) : '',
      chgU!=null ? +chgU.toFixed(2) : ''
    ]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    {wch:22},{wch:6},{wch:14},{wch:16},{wch:18},{wch:14},{wch:16},{wch:18},{wch:18},{wch:20},{wch:22}
  ];

  // Style header row bold (xlsx-style not natively supported in free xlsx, but we set bold via cell object)
  const hdrRange = XLSX.utils.decode_range(ws['!ref']);
  for (let C=hdrRange.s.c; C<=hdrRange.e.c; C++) {
    const addr = XLSX.utils.encode_cell({r:0,c:C});
    if (!ws[addr]) continue;
    ws[addr].s = { font:{bold:true}, fill:{fgColor:{rgb:"1A3D6E"}}, font:{bold:true,color:{rgb:"FFFFFF"}} };
  }

  XLSX.utils.book_append_sheet(wb, ws, "PIT Count Data");

  // Sheet 2: 2024 totals only
  const rows2 = [["State","Abbr","Overall","Sheltered","Unsheltered"]];
  Object.values(DATA).sort((a,b)=>b.y2024.overall-a.y2024.overall).forEach(r=>{
    rows2.push([r.name,r.abbr,r.y2024.overall,r.y2024.sheltered,r.y2024.unsheltered]);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols'] = [{wch:22},{wch:6},{wch:12},{wch:12},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws2, "2024 Totals (Ranked)");

  // Sheet 3: 2023–2024 change
  const rows3 = [["State","Abbr","Overall % Chg","Sheltered % Chg","Unsheltered % Chg"]];
  Object.values(DATA).sort((a,b)=>{
    const ca=((a.y2024.overall-a.y2023.overall)/a.y2023.overall*100);
    const cb=((b.y2024.overall-b.y2023.overall)/b.y2023.overall*100);
    return cb-ca;
  }).forEach(r=>{
    const chgO = +((r.y2024.overall-r.y2023.overall)/r.y2023.overall*100).toFixed(2);
    const chgS = +((r.y2024.sheltered-r.y2023.sheltered)/r.y2023.sheltered*100).toFixed(2);
    const chgU = r.y2023.unsheltered ? +((r.y2024.unsheltered-r.y2023.unsheltered)/r.y2023.unsheltered*100).toFixed(2) : '';
    rows3.push([r.name, r.abbr, chgO, chgS, chgU]);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(rows3);
  ws3['!cols'] = [{wch:22},{wch:6},{wch:16},{wch:16},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws3, "2023-2024 Change (Ranked)");

  XLSX.writeFile(wb, "HUD_PIT_Homelessness_2023_2024.xlsx");
}

async function buildMap() {
  const us = await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json');
  document.getElementById('loading').remove();
  const svg = d3.select('#map-container').append('svg').attr('viewBox','0 0 975 610').attr('preserveAspectRatio','xMidYMid meet');
  const geoPath = d3.geoPath();
  const statesGeo = topojson.feature(us, us.objects.states);

  const statePaths = svg.selectAll('.state').data(statesGeo.features).enter().append('path')
    .attr('class','state').attr('d',geoPath)
    .attr('fill',d=>getFillColor(String(d.id).padStart(2,'0')));

  svg.append('path').datum(topojson.mesh(us,us.objects.states,(a,b)=>a!==b))
    .attr('fill','none').attr('stroke','#fff').attr('stroke-width',0.8).attr('stroke-linejoin','round').attr('d',geoPath);

  const labelGroup = svg.append('g').attr('pointer-events','none');
  const stateLabels = labelGroup.selectAll('text').data(statesGeo.features).enter().append('text')
    .attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('x',d=>{
      const r=DATA[String(d.id).padStart(2,'0')];
      if (r && LABEL_ABSOLUTE[r.abbr]) return LABEL_ABSOLUTE[r.abbr][0];
      const off = r && LABEL_OFFSETS[r.abbr];
      return geoPath.centroid(d)[0] + (off ? off[0] : 0);
    })
    .attr('y',d=>{
      const r=DATA[String(d.id).padStart(2,'0')];
      if (r && LABEL_ABSOLUTE[r.abbr]) return LABEL_ABSOLUTE[r.abbr][1];
      const off = r && LABEL_OFFSETS[r.abbr];
      return geoPath.centroid(d)[1] + (off ? off[1] : 0);
    })
    .attr('font-family',FONT).attr('font-weight','700')
    .attr('font-size',d=>{ const r=DATA[String(d.id).padStart(2,'0')]; return (!r||SKIP_LABEL.has(r.abbr))?'0':'15'; })
    .attr('fill',d=>getLabelColor(String(d.id).padStart(2,'0')))
    .text(d=>{ const r=DATA[String(d.id).padStart(2,'0')]; return (!r||SKIP_LABEL.has(r.abbr))?'':r.abbr; });

  const tooltip=document.getElementById('tooltip');
  statePaths
    .on('mousemove',(event,d)=>{ const fips=String(d.id).padStart(2,'0'); if(!DATA[fips])return; tooltip.innerHTML=buildTooltip(fips); tooltip.classList.add('visible'); tooltip.style.left=Math.min(event.clientX+16,window.innerWidth-250)+'px'; tooltip.style.top=(event.clientY-10)+'px'; })
    .on('mouseleave',()=>tooltip.classList.remove('visible'));

  function redraw() {
    statePaths.attr('fill',d=>getFillColor(String(d.id).padStart(2,'0')));
    stateLabels.attr('fill',d=>getLabelColor(String(d.id).padStart(2,'0')));
    renderLegend(); updateTitles();
  }

  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeView=btn.dataset.view; redraw(); });
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); activeTab=btn.dataset.tab; redraw(); });
  });
  document.getElementById('export-btn').addEventListener('click', exportToExcel);
}

renderLegend();
updateTitles();
buildMap();
</script>
